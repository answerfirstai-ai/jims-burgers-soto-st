<style>
:root{--red:#d11a10;--red-deep:#9a150d;--mustard:#f0c830;--ink:#1b1513;--paper:#fff3da;--slab:'Alfa Slab One',Georgia,serif;--body:'Instrument Sans',system-ui,sans-serif;--pad:clamp(20px,5vw,72px);--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:24px}
body{font-family:var(--body);background:var(--ink);color:var(--paper);line-height:1.5;font-size:1.0625rem;min-height:100dvh}
img{display:block;max-width:100%}a{color:inherit}
:focus-visible{outline:3px solid var(--mustard);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:14px 24px;font:700 1.02rem/1.2 var(--body);text-align:center;text-decoration:none;cursor:pointer;border:3px solid var(--ink);background:var(--mustard);color:var(--ink);box-shadow:6px 6px 0 var(--ink);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px var(--pad)}
header img{width:104px;height:auto}
header a.tel{font-weight:700;text-decoration:none}
.hr{display:flex;align-items:center;gap:18px}
.lang{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;font:700 .98rem/1 var(--body);text-decoration:none;white-space:nowrap;color:var(--ink);background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink),0 6px 18px #0008;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.lang:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink),0 8px 20px #0008}
.lang:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.doc{background:var(--paper);color:var(--ink);padding:clamp(44px,6vw,84px) var(--pad);border-block:6px solid var(--red)}
.doc .in{max-width:820px;margin:0 auto}
.doc h1{font:400 clamp(2.2rem,5.4vw,3.8rem)/1.02 var(--slab);color:var(--red);text-wrap:balance}
.doc .meta{margin-top:12px;font-weight:600;opacity:.8}
.doc h2{font:400 clamp(1.35rem,2.6vw,1.8rem)/1.15 var(--slab);color:var(--red-deep);margin:38px 0 8px;text-wrap:balance}
.doc p,.doc li{max-width:68ch}
.doc p{margin-top:10px}
.doc ul{margin:10px 0 0 1.25em}
.doc li{margin-top:6px}
.doc a{font-weight:700;text-underline-offset:3px}
.doc .btn{text-decoration:none}
.opt{margin-top:16px;padding:20px;background:#fff8ea;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--red)}
.opt p:first-child{margin-top:0}
.opt .btn{margin-top:14px}
footer{padding:36px var(--pad) 56px;font-size:.98rem}
footer .in{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;max-width:1100px;margin:0 auto}
@media (max-width:560px){.hr .tel{display:none}header img{width:88px}}
@media (prefers-reduced-motion:reduce){.btn,.lang{transition:none}}
</style>
</head>
<body data-depth="off">
<header>
  <a href="{{home}}" aria-label="{{ord_logo_aria}}"><img src="{{root}}assets/logo.png" alt="{{name}}" width="212" height="108"></a>
  <div class="hr"><a class="tel" href="tel:{{tel}}">{{phone}}</a>{{@lang_link}}</div>
</header>

<main class="doc">
  <div class="in">
    <h1>{{pv_h1}}</h1>
    <p class="meta">{{pv_updated}}</p>
    {{pv_body}}
  </div>
</main>

<footer><div class="in"><span>{{name}}, {{addr_line}}</span><a href="{{home}}">{{ord_back}}</a></div></footer>

<script>
(() => {
  const K = 'jb_optout', btn = document.getElementById('optout-btn'), st = document.getElementById('optout-state'), g = document.getElementById('gpc-state');
  if (g && navigator.globalPrivacyControl === true) g.hidden = false;
  const get = () => { try { return localStorage.getItem(K) === '1'; } catch (e) { return false; } };
  const paint = (failed) => {
    const off = get();
    st.textContent = failed ? btn.dataset.fail : (off ? btn.dataset.stateOff : btn.dataset.stateOn);
    btn.textContent = off ? btn.dataset.labelOn : btn.dataset.labelOff;
    btn.setAttribute('aria-pressed', off ? 'true' : 'false');
  };
  btn.addEventListener('click', () => {
    let failed = false;
    try { get() ? localStorage.removeItem(K) : localStorage.setItem(K, '1'); } catch (e) { failed = true; }
    paint(failed);
  });
  paint(false);
})();
</script>
<script src="{{root}}assets/track.js" defer></script>
</body>
</html>
