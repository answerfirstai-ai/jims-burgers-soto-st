<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page not found | {{name}}</title><meta name="robots" content="noindex">
<link rel="icon" href="{{base_path}}/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Instrument+Sans:wght@600;700&display=swap">
<style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#1b1513;color:#fff3da;font-family:'Instrument Sans',system-ui,sans-serif;text-align:center;padding:24px}
img{width:150px;height:auto;margin:0 auto 24px}h1{font:400 clamp(2.4rem,8vw,4.5rem)/1 'Alfa Slab One',Georgia,serif;margin:0 0 14px}p{font-size:1.15rem;margin:0 0 28px}
.es{opacity:.85;margin-top:-10px}.es h2{font:400 clamp(1.3rem,4vw,2rem)/1.1 'Alfa Slab One',Georgia,serif;margin:0 0 10px}.es p{margin:0 0 28px}
.go{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
a.b{display:inline-block;padding:16px 28px;background:#f0c830;color:#1b1513;border:3px solid #000;box-shadow:6px 6px 0 #d11a10;font-weight:700;text-decoration:none}a.b:hover{transform:translate(-2px,-2px)}</style></head>
<body><main><img src="{{base_path}}/assets/logo.png" alt="{{name}}" width="212" height="108"><h1>{{nf_h1_en}}</h1><p>{{nf_p_en}}</p>
<div class="es" lang="es"><h2>{{nf_h1_es}}</h2><p>{{nf_p_es}}</p></div>
<div class="go"><a class="b" href="{{base_path}}/">{{nf_btn_en}}</a><a class="b" href="{{base_path}}/es/" lang="es">{{nf_btn_es}}</a></div></main></body></html>
